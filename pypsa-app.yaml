# pypsa-app layout contract. Read by pypsa-app, not by Snakemake.
# pull: what a run on a remote backend brings back to the hub.
# keep: trees the cluster owns, which a push never deletes from the mirror.
pull:
  - /results/**
  - /logs/**
  - /resources/onshore_regions.geojson
keep:
  - /data/
  - /resources/
  - /benchmarks/
  - /cutouts/
  - /.snakemake/
